<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mazegen</title>
    <meta name="description" content="Printable mazes, sized for paper and for the hand holding the crayon." />

    <!-- The manifest link and the service-worker registration are injected at
         build time by vite-plugin-pwa; the tags below are the ones it does not
         handle. -->
    <meta name="theme-color" content="#1d4ed8" />

    <!-- iOS ignores the manifest for home-screen behaviour and reads these
         instead. Without them the app opens in Safari with an address bar a
         child can tap out of; with them it launches chrome-free. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="mazegen" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
